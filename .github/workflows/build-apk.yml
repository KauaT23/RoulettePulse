name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle :app:assembleDebug

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RoulettePulse.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RoulettePulse-APK
          path: RoulettePulse.apk
