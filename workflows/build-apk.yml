name: Gerar APK V6
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk RoulettePulse-V6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RoulettePulse-V6-APK
          path: RoulettePulse-V6.apk
